<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#032629" />
  <title>لا يوجد اتصال | Big Education</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#eff9f7;background:radial-gradient(ellipse at 85% 0%,#084347 0%,transparent 50%),#032629;text-align:center}
    .card{max-width:380px;display:flex;flex-direction:column;align-items:center;gap:14px}
    img{width:88px;height:88px;border-radius:22px}
    h1{font-size:20px;margin:6px 0 0}
    p{color:#abc8c5;line-height:1.9;margin:0;font-size:14px}
    button{margin-top:8px;min-height:44px;padding:8px 22px;border-radius:10px;border:1px solid #58bbb1;background:#3b928c;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="Big Education" />
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
